# One always-on Render web service: the Docker image builds the React frontend
# and serves it together with the API, so there is no CORS setup, no
# VITE_API_BASE, and no serverless time limit. Background runs, pause/resume/
# cancel and live SSE streaming all work because the process stays alive.
# Every `sync: false` value is pasted by you in the Render dashboard - no real
# secret lives in this repo. See docs/render.md.
services:
  - type: web
    name: aco
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: RUN_TIMEOUT_S
        value: "1800"
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b
      - key: GEMINI_MODELS
        value: gemini-2.5-flash
      - key: OPENAI_MODELS
        value: gpt-4o-mini
      - key: MAX_CONCURRENT_MODEL_CALLS
        value: "4"
      # Generated once by Render; signs login tokens.
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      # Durable history (free tier disk is wiped on every deploy/restart).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set at least one provider key.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
